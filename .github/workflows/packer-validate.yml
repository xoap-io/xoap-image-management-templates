---
name: Packer validate

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  fmt:
    name: packer fmt -check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest
      - name: Check formatting (packer-hcl)
        run: packer fmt -check -recursive packer-hcl/
      - name: Check formatting (templates)
        run: packer fmt -check -recursive templates/

  syntax:
    name: packer validate -syntax-only (all variants)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest
      - name: Syntax-only validate every template directory
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          # Every directory that contains a .pkr.hcl is a candidate template dir.
          while IFS= read -r dir; do
            echo "::group::$dir"
            ( cd "$dir" && packer init . >/dev/null 2>&1 || true; packer validate -syntax-only . ) || rc=1
            echo "::endgroup::"
          done < <(find packer-hcl templates -name '*.pkr.hcl' -exec dirname {} \; | sort -u)
          exit $rc

  validate:
    name: packer validate (verified variants)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest
      # Full validation (checks floppy_files / file references) for the variants
      # whose provisioner + floppy references have been reconciled. Expand this
      # matrix as more variants are migrated to the consolidated template.
      - name: Validate w2022-2108-std-core-en
        working-directory: packer-hcl/vmware-iso/windows/w2022-2108/w2022-2108-std-core-en
        run: |
          packer init . >/dev/null 2>&1 || true
          packer validate -var-file=vmware-iso-w2022-2108-std-core-en.pkrvars.hcl .
