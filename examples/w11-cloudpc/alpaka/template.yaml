# Windows 11 Windows 365 CloudPC custom image (alpaka v6.0.0).
#
# TARGET: azure-arm. Windows 365 custom images live in Azure and must land in an Azure
# Compute Gallery (Gen2), so this set builds a temporary VM from the Windows 11 marketplace
# image, provisions it, generalizes it, captures a managed image and publishes a NEW
# Compute Gallery image version selectable as a Windows 365 custom image.
#
# Each action's script path (scripts/NAME.ps1) is resolved by alpaka INSIDE this template's
# directory. Vendor them first with:  pwsh examples/sync-demo-scripts.ps1 -Set w11-cloudpc
#
# Build-time environment variables required:
#   AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID  (cloud creds)
#
# CAVEAT — Trusted Launch / TPM: the azure-arm plugin does NOT set a VM SecurityProfile, so we
# build a STANDARD Gen2 VM (win11-24h2-ent). Gen2 is required for Windows 365 custom images.
# Trusted Launch/TPM cannot be asserted by the plugin today — that is a plugin gap to confirm,
# not a template error.
#
# NOTE: do NOT add an Enable_Bitlocker action — Windows 365 forbids BitLocker in the image;
# CloudPC manages disk encryption itself and rejects a BitLocker-encrypted image.
#
# Prerequisite: accept the Windows 11 marketplace terms once for the subscription.
version: "2.0"
description: "Windows 11 24H2 Windows 365 CloudPC custom image — azure-arm Gen2 managed image + Compute Gallery version"

variables:
  image_name: "w11-cloudpc"
  location: "westeurope"
  vm_size: "Standard_D4s_v5"
  images_rg: "alpaka-images-rg"
  gallery_name: "alpakaImageGallery"
  image_version: "1.0.0"
  cloudpc_safe: "1"     # keep Windows 365-required inbox apps during debloat
  cloudpc_failfast: ""  # set to "1" to stop validation at the first violation
  winrm_username: "alpakaadmin"
  winrm_password: "Alpaka!Build2026#W11"

sensitive_variables:
  - winrm_password

target_platforms:
  - name: "{{ image_name }}"
    type: "azure-arm"
    client_id: "{{env `AZURE_CLIENT_ID`}}"
    client_secret: "{{env `AZURE_CLIENT_SECRET`}}"
    tenant_id: "{{env `AZURE_TENANT_ID`}}"
    subscription_id: "{{env `AZURE_SUBSCRIPTION_ID`}}"
    location: "{{ location }}"

    # --- source: Windows 11 24H2 Enterprise (Gen2, standard security; NO BitLocker) ---
    image_publisher: "MicrosoftWindowsDesktop"
    image_offer: "Windows-11"
    image_sku: "win11-24h2-ent"
    image_version: "latest"

    vm_size: "{{ vm_size }}"
    os_type: "Windows"
    os_disk_size_gb: "128"
    disk_caching_type: "ReadWrite"

    # temp RG auto-created + deleted; managed image kept in images_rg
    managed_image_name: "{{ image_name }}-golden"
    managed_image_resource_group_name: "{{ images_rg }}"
    managed_image_storage_account_type: "Standard_LRS"

    # destination: NEW versioned Gen2 image in the Azure Compute Gallery
    target_gallery_name: "{{ gallery_name }}"
    target_resource_group: "{{ images_rg }}"
    target_image_name: "windows-11-cloudpc"
    target_image_version: "{{ image_version }}"
    replication_regions: 1
    target_regions:
      - name: "westeurope"
        replica_count: 1

    azure_tags:
      Environment: "demo"
      OS: "Windows 11 24H2"
      Workload: "Windows365-CloudPC"
      ManagedBy: "Alpaka"

connection:
  type: "winrm"
  username: "{{ winrm_username }}"
  password: "{{ winrm_password }}"
  use_ssl: true
  insecure: true
  timeout: "30m"

actions:
  - type: windows-update
    name: patch
    timeout: "60m"

  - type: powershell
    name: remove-apps-cloudpc-safe
    timeout: "15m"
    script: "scripts/windows11-W11_24H2_Remove_Apps.ps1"
    environment:
      CLOUDPC_SAFE: "{{ cloudpc_safe }}"

  - type: powershell
    name: prepare-cloudpc
    timeout: "15m"
    script: "scripts/windows11-Prepare_CloudPC.ps1"

  # --- staged Pester validation (aborts the build before capture on any failure) ---
  - type: file
    name: stage-tests
    source: "../tests/W11-CloudPC.Tests.ps1"
    destination: "C:/Alpaka/Tests/W11-CloudPC.Tests.ps1"
    direction: "upload"
    timeout: "5m"

  - type: powershell
    name: pester-validate
    timeout: "20m"
    inline:
      - "Set-ExecutionPolicy Bypass -Scope Process -Force; [Net.ServicePointManager]::SecurityProtocol=3072; Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null; if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) { Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope AllUsers }; Import-Module Pester -MinimumVersion 5.0.0 -Force; $cfg = New-PesterConfiguration; $cfg.Run.Path='C:\\Alpaka\\Tests'; $cfg.Run.PassThru=$true; $cfg.Output.Verbosity='Detailed'; $r=Invoke-Pester -Configuration $cfg; if ($r.FailedCount -gt 0) { throw (\"Pester: {0}/{1} tests failed\" -f $r.FailedCount,$r.TotalCount) }"

  - type: powershell
    name: cleanup
    timeout: "15m"
    script: "scripts/windows11-Cleanup_Temporary_Files.ps1"

  # Gate: exits non-zero (fails the build) if the image violates CloudPC requirements.
  # Kept LAST before sysprep so it inspects the fully-provisioned, cleaned image.
  - type: powershell
    name: validate-cloudpc-image
    timeout: "15m"
    script: "scripts/windows11-Validate_CloudPC_Image.ps1"
    environment:
      CLOUDPC_FAILFAST: "{{ cloudpc_failfast }}"

  - type: powershell
    name: sysprep-generalize
    timeout: "30m"
    script: "scripts/windows-server-Invoke_Sysprep.ps1"
    environment:
      SYSPREP_VMMODE: "1"
      SYSPREP_MODE: "OOBE"
      SYSPREP_SHUTDOWN: "Shutdown"
    valid_exit_codes: [0, 3010]

post_build:
  - name: "manifest"
    type: "manifest"
    output: "w11-cloudpc-manifest.json"
    strip_path: true
