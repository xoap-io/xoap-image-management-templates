# Windows 11 Enterprise — Hyper-V (Gen2) base golden image (alpaka v6 / hyperv-iso).
#
# Builds a clean, optimized and generalized Windows 11 Enterprise base image on Hyper-V from the
# install ISO, using the repo's Hyper-V Gen2 W11 Autounattend answer file and Integration Services.
#
# Script paths below are resolved by alpaka INSIDE this template directory. Vendor them first:
# `pwsh examples/sync-demo-scripts.ps1 -Set w11-base-hyperv`.
version: "2.0"
description: "Windows 11 Enterprise Hyper-V Gen2 base golden image"

variables:
  iso_url: "{{env `HYPERV_ISO_URL`}}"
  iso_checksum: "{{env `HYPERV_ISO_CHECKSUM`}}"
  vm_name: "w11-base"

sensitive_variables:
  - winrm_password

target_platforms:
  - name: "w11-base-hyperv"
    type: "hyperv-iso"
    # --- ISO source (supply via env) ---
    iso_url: "{{ iso_url }}"
    iso_checksum: "{{ iso_checksum }}"

    # --- VM hardware (Generation 2, UEFI + Secure Boot + vTPM for Windows 11) ---
    vm_name: "{{ vm_name }}"
    generation: 2
    cpus: 4
    memory: 8192
    enable_dynamic_memory: true
    dynamic_memory_min_mb: 4096
    dynamic_memory_max_mb: 8192
    disk_size: 65536
    switch_name: "Default Switch"
    enable_secure_boot: true
    secure_boot_template: "MicrosoftWindows"
    enable_tpm: true
    first_boot_device: "DVD"
    headless: true

    # --- Autounattend (Windows 11 Enterprise, Hyper-V Gen2) attached via CD (Gen2 has no floppy) ---
    cd_files:
      - "../../../autounattend/W11/hyperv-gen2/Autounattend-Enterprise.xml"
    cd_label: "config"

    boot_wait: "5s"

    # --- WinRM (provisioning connection) ---
    connection: "winrm"
    winrm_username: "Administrator"
    winrm_password: "{{env `HYPERV_WIN_ADMIN_PASSWORD`}}"
    winrm_port: 5986
    winrm_use_ssl: true
    winrm_insecure: true
    winrm_timeout: "30m"

    shutdown_command: "shutdown /s /t 10 /f /d p:4:1 /c \"Alpaka Shutdown\""
    shutdown_timeout: "15m"

    # --- Output: base image/template ---
    output_directory: "output-w11-base-hyperv"
    skip_compaction: false

actions:
  - type: powershell
    name: install-hyperv-integration
    script: "scripts/windows11-Install_HyperV_Integration.ps1"
    timeout: "20m"
    valid_exit_codes: [0, 3010]

  - type: powershell
    name: optimize-w11
    script: "scripts/windows11-Optimize_W11_25H2.ps1"
    timeout: "20m"

  - type: powershell
    name: cleanup
    script: "scripts/windows11-Cleanup_Temporary_Files.ps1"
    timeout: "20m"

  # --- stage + run Pester before sysprep (a failed test aborts the build) ---
  - type: file
    name: stage-tests
    source: "../tests/W11BaseHyperV.Tests.ps1"
    destination: "C:/Alpaka/Tests/W11BaseHyperV.Tests.ps1"
    direction: "upload"

  - type: powershell
    name: pester-validate
    timeout: "20m"
    inline:
      - "Set-ExecutionPolicy Bypass -Scope Process -Force; [Net.ServicePointManager]::SecurityProtocol=3072; Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null; if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) { Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope AllUsers }; Import-Module Pester -MinimumVersion 5.0.0 -Force; $cfg = New-PesterConfiguration; $cfg.Run.Path='C:\\Alpaka\\Tests'; $cfg.Run.PassThru=$true; $cfg.Output.Verbosity='Detailed'; $r=Invoke-Pester -Configuration $cfg; if ($r.FailedCount -gt 0) { throw (\"Pester: {0}/{1} tests failed\" -f $r.FailedCount,$r.TotalCount) }"

  - type: powershell
    name: sysprep-generalize
    script: "scripts/windows-server-Invoke_Sysprep.ps1"
    timeout: "30m"
    environment:
      SYSPREP_VMMODE: "1"
      SYSPREP_MODE: "OOBE"
      SYSPREP_SHUTDOWN: "Shutdown"
    valid_exit_codes: [0, 3010]

post_build:
  - name: "manifest"
    type: "manifest"
    output: "w11-base-hyperv-manifest.json"
    strip_path: true
