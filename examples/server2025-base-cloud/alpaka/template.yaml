# Windows Server 2025 cloud base image (alpaka v6 taxonomy) — AZURE flavor.
#
# Builds a hardened Windows Server 2025 Datacenter Azure Edition (Gen2) golden image in
# Azure: the azure-arm builder spins a temporary VM from the marketplace image, patches
# it, applies the CIS baseline, disables legacy SMBv1, installs the Azure guest tools,
# runs the Azure performance pass, validates with Pester (a failed assertion aborts the
# build), cleans up and generalizes with Sysprep, then captures a managed image and
# publishes a Compute Gallery image version.
#
# Script paths below are resolved by alpaka INSIDE this template directory. Vendor the
# referenced scripts into ./scripts first:  pwsh examples/sync-demo-scripts.ps1 -Set server2025-base-cloud
#
# CLOUD SWAP: this template targets AZURE. To build for AWS or GCP, change the target
# platform type (amazon-ebs / googlecompute) and swap the two cloud-specific actions for
# the AWS/GCP alternatives. See ../README.md for the per-cloud script table and notes.
#
# NOTE: no Trusted Launch — a standard Gen2 SKU is used (the azure-arm plugin does not
# rely on Trusted Launch).
version: "2.0"
description: "Windows Server 2025 azure-arm — hardened cloud base: managed image + gallery version"

variables:
  image_name: "server2025-base-cloud"
  location: "westeurope"
  vm_size: "Standard_D2s_v3"
  images_rg: "alpaka-images-rg"            # existing resource group for the managed image + gallery
  gallery_name: "alpakaImageGallery"
  image_version: "1.0.0"
  winrm_username: "alpakaadmin"
  winrm_password: "Alpaka!Build2026#WS"

sensitive_variables:
  - winrm_password

target_platforms:
  - name: "{{ image_name }}"
    type: "azure-arm"
    # --- auth (service principal; resolved from the environment / XOAP Connection) ---
    client_id: "{{env `AZURE_CLIENT_ID`}}"
    client_secret: "{{env `AZURE_CLIENT_SECRET`}}"
    tenant_id: "{{env `AZURE_TENANT_ID`}}"
    subscription_id: "{{env `AZURE_SUBSCRIPTION_ID`}}"
    location: "{{ location }}"

    # --- source: Windows Server 2025 Datacenter Azure Edition (Gen2) ---
    image_publisher: "MicrosoftWindowsServer"
    image_offer: "WindowsServer"
    image_sku: "2025-datacenter-azure-edition"
    image_version: "latest"

    # --- VM ---
    vm_size: "{{ vm_size }}"
    os_type: "Windows"
    os_disk_size_gb: "128"
    disk_caching_type: "ReadWrite"

    # --- managed image output (zone-resilient) into an existing RG ---
    managed_image_name: "{{ image_name }}-golden"
    managed_image_resource_group_name: "{{ images_rg }}"
    managed_image_storage_account_type: "Standard_LRS"
    managed_image_zone_resilient: true

    # --- Compute Gallery: publish a new version replicated in the build region ---
    target_gallery_name: "{{ gallery_name }}"
    target_resource_group: "{{ images_rg }}"
    target_image_name: "windows-server-2025-base"
    target_image_version: "{{ image_version }}"
    replication_regions: 1
    target_regions:
      - name: "westeurope"
        replica_count: 1
    exclude_from_latest: false

    azure_tags:
      Environment: "test"
      OS: "Windows Server 2025"
      Role: "cloud-base"
      ManagedBy: "Alpaka"
      Flow: "azure-arm-managed-gallery"

connection:
  type: "winrm"
  username: "{{ winrm_username }}"
  password: "{{ winrm_password }}"
  use_ssl: true
  insecure: true
  timeout: "30m"

actions:
  # 1) Patch first.
  - type: windows-update
    name: patch
    timeout: "60m"

  # 2) CIS hardening baseline.
  - type: powershell
    name: apply-cis-benchmarks
    timeout: "15m"
    script: "scripts/windows-server-Apply_CIS_Benchmarks.ps1"

  # 3) Remove the legacy SMBv1 protocol.
  - type: powershell
    name: disable-smbv1
    timeout: "15m"
    script: "scripts/windows-server-Disable_SMBv1_Legacy.ps1"

  # 4) Cloud guest tools (AZURE). AWS: scripts/aws/Install_AWS_Tools.ps1  GCP: scripts/google/Install_GCP_Tools.ps1
  - type: powershell
    name: install-cloud-tools
    timeout: "30m"
    script: "scripts/azure/Install_Azure_Tools.ps1"

  # 5) Cloud performance pass (AZURE). AWS: scripts/aws/Optimize_AWS_EC2_Performance.ps1  GCP: scripts/google/Optimize_GCP_Performance.ps1
  - type: powershell
    name: optimize-cloud
    timeout: "15m"
    script: "scripts/azure/Optimize_Azure_Performance.ps1"

  # 6) Stage + run Pester; a failed assertion aborts the build (image never captured).
  - type: file
    name: stage-tests
    source: "../tests/WindowsServer2025Base.Tests.ps1"
    destination: "C:/Alpaka/Tests/WindowsServer2025Base.Tests.ps1"
    direction: "upload"

  - type: powershell
    name: pester-validate
    timeout: "20m"
    inline:
      - "Set-ExecutionPolicy Bypass -Scope Process -Force; [Net.ServicePointManager]::SecurityProtocol=3072; Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null; if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) { Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope AllUsers }; Import-Module Pester -MinimumVersion 5.0.0 -Force; $cfg = New-PesterConfiguration; $cfg.Run.Path='C:\\Alpaka\\Tests'; $cfg.Run.PassThru=$true; $cfg.Output.Verbosity='Detailed'; $r=Invoke-Pester -Configuration $cfg; if ($r.FailedCount -gt 0) { throw (\"Pester: {0}/{1} tests failed\" -f $r.FailedCount,$r.TotalCount) }"

  # 7) Reclaim space.
  - type: powershell
    name: cleanup
    timeout: "15m"
    script: "scripts/windows-server-Cleanup_Temporary_Files.ps1"

  # 8) Generalize for capture (Sysprep may exit 3010).
  - type: powershell
    name: sysprep-generalize
    timeout: "30m"
    script: "scripts/windows-server-Invoke_Sysprep.ps1"
    environment:
      SYSPREP_VMMODE: "1"
      SYSPREP_MODE: "OOBE"
      SYSPREP_SHUTDOWN: "Shutdown"
    valid_exit_codes: [0, 3010]

post_build:
  - name: "manifest"
    type: "manifest"
    output: "server2025-base-cloud-azure-manifest.json"
    strip_path: true
